<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Material Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <nav class="app-nav">
            <div class="nav-title">Habit Tracker</div>
            <div class="nav-quote" id="navQuote">Stay consistent</div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Sidebar: Add Habit Form -->
            <aside class="sidebar">
                <div class="sidebar-card">
                    <h2>Add Habit</h2>
                    <form id="habitForm" class="habit-form">
                        <div class="form-group">
                            <label>Habit Name</label>
                            <input type="text" id="habitName" placeholder="e.g., Read 30 min" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="habitDescription" placeholder="Optional">
                        </div>
                        <div class="form-group">
                            <label>Frequency</label>
                            <select id="habitFrequency" required>
                                <option value="">Select frequency</option>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Add Habit</button>
                    </form>
                </div>
            </aside>

            <!-- Center: Habits Grid -->
            <section class="habits-section">
                <h2>Active Habits</h2>
                <div class="habits-grid" id="habitsGrid">
                    <div class="empty-state">
                        <p>No habits yet. Add one to get started!</p>
                    </div>
                </div>
            </section>

            <!-- Right Sidebar: Analytics & Stats -->
            <aside class="sidebar-right">
                <div class="sidebar-card analytics-card">
                    <h2>Statistics</h2>
                    <div class="stat-item">
                        <span class="stat-label">Total Habits</span>
                        <span class="stat-value" id="totalHabits">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Completed Today</span>
                        <span class="stat-value" id="completedToday">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Average Streak</span>
                        <span class="stat-value" id="avgStreak">0</span>
                    </div>
                    <button class="btn btn-secondary btn-full" id="detailedAnalyticsBtn">View Details</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Detailed Analytics Modal -->
    <div class="modal" id="analyticsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detailed Analytics</h2>
                <button class="btn-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="detailedAnalytics"></div>
        </div>
    </div>

    <script src="script.ts"></script>
</body>
</html>
